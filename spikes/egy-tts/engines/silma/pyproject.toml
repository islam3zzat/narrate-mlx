[project]
name = "egy-silma"
version = "0"
requires-python = ">=3.10,<3.13"
dependencies = ["silma-tts", "nemo-text-processing-stub", "onnxruntime"]

[tool.uv]
override-dependencies = ["onnxruntime-gpu ; sys_platform == 'never'", "onnxruntime", "nemo-text-processing ; sys_platform == 'never'", "pynini ; sys_platform == 'never'"]

[tool.uv.sources]
nemo-text-processing-stub = { path = "stub" }
